name: android-engine
# The engine as a host app embeds it (Fold Craft Launcher), built on GitHub's runners for the
# working branch: the arm64 library, the Java launcher libraries horizon-prepare runs on the phone,
# and the assets the host bundles in its own APK, kept as one artifact (the layout matches a host's
# jniLibs/arm64-v8a and assets/). The `starling` branch only mirrors upstream and builds nothing.
#
# The engine's own APK is not built here: the host app supplies the manifest, Java side and signing.
on:
  push:
    branches: [starling-engine]
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile for the engine library
        type: choice
        options: [quick, fast]
        default: fast
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  engine:
    runs-on: ubuntu-latest
    # The fast profile builds slower (fewer codegen units).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # JDK 25 compiles/link-checks original exporters; the build-tools supply d8/javac.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the build-tools, platform and NDK build_apk.py pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64-v8a
          save-if: ${{ github.ref == 'refs/heads/starling' }}
      # target/android/host holds what a host app bundles: libhorizon_android.so, the Java
      # launcher libraries, and prepare-kit.zip/lowbudget.zip/StarlingVisuals.zip.
      - name: Build the library a host app embeds
        env:
          PROFILE: ${{ inputs.profile || 'fast' }}
        run: python packaging/android/build_apk.py --host-libs --abi arm64-v8a --profile "$PROFILE"
      # The artifact is a host's drop-in folder: jniLibs/arm64-v8a and assets, as the engine
      # distribution keeps them.
      - name: Lay the artifact out as a host app bundles it
        run: |
          mkdir -p dist/jniLibs/arm64-v8a
          cp target/android/host/libhorizon_android.so dist/jniLibs/arm64-v8a/
          cp target/android/host/libstarling_java.so target/android/host/libstarling_javac.so \
            dist/jniLibs/arm64-v8a/
          cp -r target/android/host/assets dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: starling-engine-arm64-v8a
          path: dist
          if-no-files-found: error
          retention-days: 90
      # The library with its symbols, to read the frames of native crashes in diagnostic ZIPs
      # (docs/android-diagnostics.md).
      - uses: actions/upload-artifact@v4
        with:
          name: starling-engine-symbols-arm64-v8a
          path: target/aarch64-linux-android/*/libhorizon_android.so
          if-no-files-found: ignore
          retention-days: 90
